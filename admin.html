<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理员后台</title>
    <style>*{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑}body{background:#f0f3f8}.hide{display:none}.login{width:400px;margin:100px auto;background:white;padding:40px;border-radius:12px;box-shadow:0 4px 20px #00000010}h2{text-align:center;margin-bottom:30px;color:#165DFF}.input{width:100%;height:44px;margin-bottom:15px;padding:0 15px;border:1px solid #ddd;border-radius:6px}.btn{width:100%;height:46px;background:#165DFF;color:white;border:none;border-radius:6px;font-size:16px}.top{background:#165DFF;color:white;padding:15px 30px;display:flex;justify-content:space-between;align-items:center}.top button{margin-left:10px;padding:6px 12px;border:none;border-radius:4px}.list{padding:20px}.table{width:100%;background:white;border-radius:8px;overflow:hidden}.table th,.table td{padding:12px;text-align:center;border-bottom:1px solid #eee}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#00000080;display:flex;align-items:center;justify-content:center}.modal .box{background:white;padding:30px;width:400px;border-radius:10px}.modal input{width:100%;height:40px;margin-bottom:10px;padding:0 10px}</style>
</head>
<body>
<div class="login" id="login">
    <h2>管理员登录</h2>
    <input class="input" id="user" placeholder="账号" value="admin">
    <input class="input" id="pwd" placeholder="密码" type="password" value="123456">
    <button class="btn" onclick="login()">登录</button>
</div>
<div class="hide" id="main">
    <div class="top">
        <div>管理员后台</div>
        <div>
            <button onclick="addUser()">添加业务员</button>
            <button onclick="logout()">退出</button>
        </div>
    </div>
    <div class="list">
        <div class="table">
            <table width="100%">
                <tr><th>账号</th><th>姓名</th><th>状态</th><th>操作</th></tr>
                <tbody id="userList"></tbody>
            </table>
        </div>
    </div>
</div>
<div class="hide" id="modal"><div class="box"><input id="acc" placeholder="账号"><input id="name" placeholder="姓名"><button onclick="saveUser()">保存</button></div></div>
<script>
const API = "https://jsonstorage.net/api/items/em-crm-2026-repair";
let data = {users:{admin:{pwd:"123456",role:"admin"}},customers:[]};
async function load(){let r=await fetch(API);if(r.ok)data=await r.json()}
async function save(){await fetch(API,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})}
function login(){let u=document.getElementById("user").value,p=document.getElementById("pwd").value;if(u==="admin"&&data.users.admin&&data.users.admin.pwd===p){document.getElementById("login").classList.add("hide");document.getElementById("main").classList.remove("hide");render();return}alert("账号或密码错误")}
function render(){let b=document.getElementById("userList");b.innerHTML="";for(let i in data.users){if(i==="admin")continue;let u=data.users[i];b.innerHTML+=`<tr><td>${i}</td><td>${u.name}</td><td>${u.deleted?"禁用":"正常"}</td><td><button onclick='toggle("${i}")'>${u.deleted?"启用":"禁用"}</button></td></tr>`}}
function addUser(){document.getElementById("modal").classList.remove("hide")}
async function saveUser(){let a=document.getElementById("acc").value,n=document.getElementById("name").value;if(!a||!n)return;if(data.users[a]){alert("账号已存在");return}data.users[a]={pwd:"123456",name:n,deleted:false};await save();render();document.getElementById("modal").classList.add("hide")}
async function toggle(a){data.users[a].deleted=!data.users[a].deleted;await save();render()}
function logout(){location.reload()}
window.onload=load
</script>
</body>
</html>
