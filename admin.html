<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EM客户管理系统 - 管理员后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 20px;
        }
        .header button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        .header button:hover {
            background: rgba(255,255,255,0.3);
        }
        .toolbar {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar select, .toolbar input {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .toolbar button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-blue {
            background: #3498db;
            color: #fff;
        }
        .btn-blue:hover {
            background: #2980b9;
        }
        .btn-red {
            background: #e74c3c;
            color: #fff;
        }
        .btn-red:hover {
            background: #c0392b;
        }
        .table-container {
            padding: 20px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }
        .modal h3 {
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal .form-group {
            margin-bottom: 15px;
        }
        .modal label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .modal input, .modal select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .modal .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .modal button {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .login-box .form-group {
            margin-bottom: 20px;
        }
        .login-box label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .login-box button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div id="loginPage" class="login-box">
        <h2>管理员登录</h2>
        <div class="form-group">
            <label>账号</label>
            <input type="text" id="adminAccount" placeholder="请输入管理员账号" value="admin">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="adminPwd" placeholder="请输入密码" value="123456">
        </div>
        <button onclick="adminLogin()">登录</button>
    </div>

    <!-- 主页面 -->
    <div id="mainPage" class="container" style="display: none;">
        <div class="header">
            <h1>EM客户管理系统 - 管理员后台</h1>
            <div>
                <button onclick="openChangePwdModal()">修改密码</button>
                <button onclick="openAddUserModal()">添加业务员</button>
                <button onclick="openManageUserModal()">管理业务员</button>
                <button onclick="exportAllCustomers()">导出客户数据</button>
                <button onclick="logout()">退出登录</button>
            </div>
        </div>

        <div class="toolbar">
            <select id="filterUser" onchange="renderCustomerTable()">
                <option value="">所有业务员</option>
            </select>
            <input type="text" id="searchKeyword" placeholder="搜索客户编号/姓名/电话/产品" oninput="renderCustomerTable()">
        </div>

        <div class="table-container">
            <h3 style="margin-bottom: 15px; color: #2c3e50;">正常业务员客户列表</h3>
            <table id="customerTable">
                <thead>
                    <tr>
                        <th>客户编号</th>
                        <th>客户姓名</th>
                        <th>客户电话</th>
                        <th>产品名称</th>
                        <th>业务员</th>
                        <th>录入时间</th>
                        <th>复审时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <h3 style="margin: 30px 0 15px; color: #e74c3c;">已删除业务员客户留档</h3>
            <table id="deletedCustomerTable">
                <thead>
                    <tr>
                        <th>客户编号</th>
                        <th>客户姓名</th>
                        <th>客户电话</th>
                        <th>产品名称</th>
                        <th>业务员</th>
                        <th>录入时间</th>
                        <th>复审时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- 修改密码弹窗 -->
    <div id="changePwdModal" class="modal-overlay">
        <div class="modal">
            <h3>修改管理员密码</h3>
            <div class="form-group">
                <label>原密码</label>
                <input type="password" id="oldPwd">
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="newPwd">
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" id="confirmNewPwd">
            </div>
            <div class="btn-group">
                <button onclick="closeModal('changePwdModal')">取消</button>
                <button class="btn-blue" onclick="changeAdminPwd()">确认修改</button>
            </div>
        </div>
    </div>

    <!-- 添加业务员弹窗 -->
    <div id="addUserModal" class="modal-overlay">
        <div class="modal">
            <h3>添加业务员</h3>
            <div class="form-group">
                <label>业务员账号</label>
                <input type="text" id="newUserAccount" placeholder="请输入业务员账号">
            </div>
            <div class="form-group">
                <label>业务员姓名</label>
                <input type="text" id="newUserName" placeholder="请输入业务员姓名">
            </div>
            <div class="form-group">
                <label>初始密码</label>
                <input type="password" id="newUserPwd" placeholder="默认123456" value="123456">
            </div>
            <div class="btn-group">
                <button onclick="closeModal('addUserModal')">取消</button>
                <button class="btn-blue" onclick="addUser()">添加</button>
            </div>
        </div>
    </div>

    <!-- 管理业务员弹窗 -->
    <div id="manageUserModal" class="modal-overlay">
        <div class="modal" style="max-width: 600px;">
            <h3>管理业务员</h3>
            <table style="width: 100%; margin-top: 15px;">
                <thead>
                    <tr>
                        <th>账号</th>
                        <th>姓名</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="manageUserTable"></tbody>
            </table>
            <div class="btn-group">
                <button onclick="closeModal('manageUserModal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 编辑客户弹窗 -->
    <div id="editCustomerModal" class="modal-overlay">
        <div class="modal">
            <h3>编辑客户信息</h3>
            <input type="hidden" id="editCustomerId">
            <div class="form-group">
                <label>客户姓名</label>
                <input type="text" id="editCustomerName">
            </div>
            <div class="form-group">
                <label>客户电话</label>
                <input type="text" id="editCustomerPhone">
            </div>
            <div class="form-group">
                <label>产品名称</label>
                <input type="text" id="editCustomerProduct">
            </div>
            <div class="form-group">
                <label>复审时间</label>
                <input type="date" id="editReviewDate">
            </div>
            <div class="btn-group">
                <button onclick="closeModal('editCustomerModal')">取消</button>
                <button class="btn-blue" onclick="saveEditedCustomer()">保存修改</button>
            </div>
        </div>
    </div>

    <script>
        // 云端数据库接口
        const DB_URL = "https://jsonblob.com/api/jsonBlob/1342259356623298560";

        // 工具函数：获取云端数据
        async function getDB() {
            const res = await fetch(DB_URL);
            return await res.json();
        }

        // 工具函数：保存数据到云端
        async function saveDB(data) {
            await fetch(DB_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
        }

        // 初始化云端数据（如果为空）
        async function initDB() {
            const db = await getDB();
            if (!db.admin) {
                await saveDB({
                    admin: { account: "admin", pwd: "123456" },
                    users: [],
                    customers: []
                });
            }
        }

        // 管理员登录
        async function adminLogin() {
            const account = document.getElementById("adminAccount").value;
            const pwd = document.getElementById("adminPwd").value;
            const db = await getDB();

            if (account === db.admin.account && pwd === db.admin.pwd) {
                document.getElementById("loginPage").style.display = "none";
                document.getElementById("mainPage").style.display = "block";
                loadFilterUserOptions();
                renderCustomerTable();
            } else {
                alert("账号或密码错误！");
            }
        }

        // 加载业务员筛选下拉框
        async function loadFilterUserOptions() {
            const db = await getDB();
            const users = db.users || [];
            const filter = document.getElementById("filterUser");
            filter.innerHTML = '<option value="">所有业务员</option>';
            users.forEach(user => {
                const option = document.createElement("option");
                option.value = user.account;
                option.textContent = user.name;
                filter.appendChild(option);
            });
        }

        // 渲染客户表格
        async function renderCustomerTable() {
            const db = await getDB();
            const customers = db.customers || [];
            const filterUser = document.getElementById("filterUser").value;
            const keyword = document.getElementById("searchKeyword").value.trim().toLowerCase();

            // 筛选客户
            let filtered = customers.filter(c => {
                const matchUser = !filterUser || c.sellerAccount === filterUser;
                const matchKeyword = !keyword || 
                    c.id.toLowerCase().includes(keyword) ||
                    c.name.toLowerCase().includes(keyword) ||
                    c.phone.includes(keyword) ||
                    c.product.toLowerCase().includes(keyword);
                return matchUser && matchKeyword;
            });

            // 正常业务员客户
            const normalUsers = (db.users || []).filter(u => !u.deleted).map(u => u.account);
            const normalCustomers = filtered.filter(c => normalUsers.includes(c.sellerAccount));
            const deletedCustomers = filtered.filter(c => !normalUsers.includes(c.sellerAccount));

            // 渲染正常客户表格
            const normalTbody = document.querySelector("#customerTable tbody");
            normalTbody.innerHTML = "";
            normalCustomers.forEach(c => {
                const row = document.createElement("tr");
                const isExpired = new Date(c.reviewDate) < new Date();
                const statusText = isExpired ? "已过期" : "正常";
                const statusColor = isExpired ? "color: #e74c3c;" : "color: #27ae60;";
                row.innerHTML = `
                    <td>${c.id}</td>
                    <td>${c.name}</td>
                    <td>${c.phone}</td>
                    <td>${c.product}</td>
                    <td>${c.sellerName}</td>
                    <td>${c.createTime}</td>
                    <td>${c.reviewDate}</td>
                    <td style="${statusColor}">${statusText}</td>
                    <td>
                        <button class="btn-blue" style="padding: 5px 10px; font-size: 12px;" onclick="openEditCustomerModal('${c.id}')">编辑</button>
                    </td>
                `;
                normalTbody.appendChild(row);
            });

            // 渲染已删除业务员客户表格
            const deletedTbody = document.querySelector("#deletedCustomerTable tbody");
            deletedTbody.innerHTML = "";
            deletedCustomers.forEach(c => {
                const row = document.createElement("tr");
                const isExpired = new Date(c.reviewDate) < new Date();
                const statusText = isExpired ? "已过期" : "正常";
                const statusColor = isExpired ? "color: #e74c3c;" : "color: #27ae60;";
                row.innerHTML = `
                    <td>${c.id}</td>
                    <td>${c.name}</td>
                    <td>${c.phone}</td>
                    <td>${c.product}</td>
                    <td>${c.sellerName}</td>
                    <td>${c.createTime}</td>
                    <td>${c.reviewDate}</td>
                    <td style="${statusColor}">${statusText}</td>
                    <td>
                        <button class="btn-blue" style="padding: 5px 10px; font-size: 12px;" onclick="openEditCustomerModal('${c.id}')">编辑</button>
                    </td>
                `;
                deletedTbody.appendChild(row);
            });
        }

        // 打开添加业务员弹窗
        function openAddUserModal() {
            document.getElementById("newUserAccount").value = "";
            document.getElementById("newUserName").value = "";
            document.getElementById("newUserPwd").value = "123456";
            document.getElementById("addUserModal").style.display = "flex";
        }

        // 添加业务员
        async function addUser() {
            const account = document.getElementById("newUserAccount").value.trim();
            const name = document.getElementById("newUserName").value.trim();
            const pwd = document.getElementById("newUserPwd").value.trim();

            if (!account || !name || !pwd) {
                alert("请填写完整信息！");
                return;
            }

            const db = await getDB();
            if (db.users.some(u => u.account === account)) {
                alert("该账号已存在！");
                return;
            }

            db.users.push({ account, name, pwd, deleted: false });
            await saveDB(db);
            alert("业务员添加成功！");
            closeModal("addUserModal");
            loadFilterUserOptions();
        }

        // 打开管理业务员弹窗
        async function openManageUserModal() {
            const db = await getDB();
            const users = db.users || [];
            const tbody = document.querySelector("#manageUserTable tbody");
            tbody.innerHTML = "";

            users.forEach(u => {
                const row = document.createElement("tr");
                const status = u.deleted ? "已删除" : "正常";
                const statusColor = u.deleted ? "color: #e74c3c;" : "color: #27ae60;";
                row.innerHTML = `
                    <td>${u.account}</td>
                    <td>${u.name}</td>
                    <td style="${statusColor}">${status}</td>
                    <td>
                        ${u.deleted ? 
                            `<button class="btn-blue" style="padding: 5px 10px; font-size: 12px;" onclick="restoreUser('${u.account}')">恢复</button>` :
                            `<button class="btn-red" style="padding: 5px 10px; font-size: 12px;" onclick="deleteUser('${u.account}')">删除留档</button>`
                        }
                    </td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById("manageUserModal").style.display = "flex";
        }

        // 删除业务员（留档）
        async function deleteUser(account) {
            if (!confirm("确定要删除该业务员吗？其客户将被留档。")) return;
            const db = await getDB();
            const user = db.users.find(u => u.account === account);
            if (user) user.deleted = true;
            await saveDB(db);
            openManageUserModal();
            renderCustomerTable();
        }

        // 恢复业务员
        async function restoreUser(account) {
            const db = await getDB();
            const user = db.users.find(u => u.account === account);
            if (user) user.deleted = false;
            await saveDB(db);
            openManageUserModal();
            renderCustomerTable();
        }

        // 打开编辑客户弹窗
        async function openEditCustomerModal(customerId) {
            const db = await getDB();
            const customer = db.customers.find(c => c.id === customerId);
            if (!customer) return;

            document.getElementById("editCustomerId").value = customerId;
            document.getElementById("editCustomerName").value = customer.name;
            document.getElementById("editCustomerPhone").value = customer.phone;
            document.getElementById("editCustomerProduct").value = customer.product;
            document.getElementById("editReviewDate").value = customer.reviewDate;
            document.getElementById("editCustomerModal").style.display = "flex";
        }

        // 保存编辑的客户信息
        async function saveEditedCustomer() {
            const customerId = document.getElementById("editCustomerId").value;
            const name = document.getElementById("editCustomerName").value.trim();
            const phone = document.getElementById("editCustomerPhone").value.trim();
            const product = document.getElementById("editCustomerProduct").value.trim();
            const reviewDate = document.getElementById("editReviewDate").value;

            if (!name || !phone || !product || !reviewDate) {
                alert("请填写完整信息！");
                return;
            }

            const db = await getDB();
            const customer = db.customers.find(c => c.id === customerId);
            if (!customer) return;

            customer.name = name;
            customer.phone = phone;
            customer.product = product;
            customer.reviewDate = reviewDate;

            await saveDB(db);
            alert("修改成功！");
            closeModal("editCustomerModal");
            renderCustomerTable();
        }

        // 修改管理员密码
        async function changeAdminPwd() {
            const oldPwd = document.getElementById("oldPwd").value;
            const newPwd = document.getElementById("newPwd").value;
            const confirmPwd = document.getElementById("confirmNewPwd").value;

            const db = await getDB();
            if (oldPwd !== db.admin.pwd) {
                alert("原密码错误！");
                return;
            }
            if (newPwd !== confirmPwd) {
                alert("两次输入的新密码不一致！");
                return;
            }
            if (!newPwd) {
                alert("新密码不能为空！");
                return;
            }

            db.admin.pwd = newPwd;
            await saveDB(db);
            alert("密码修改成功！请重新登录。");
            closeModal("changePwdModal");
            logout();
        }

        // 导出所有客户数据
        async function exportAllCustomers() {
            const db = await getDB();
            const customers = db.customers || [];
            if (customers.length === 0) {
                alert("暂无客户数据可导出！");
                return;
            }

            let csv = "客户编号,客户姓名,客户电话,产品名称,业务员,录入时间,复审时间,状态\n";
            customers.forEach(c => {
                const isExpired = new Date(c.reviewDate) < new Date();
                const status = isExpired ? "已过期" : "正常";
                csv += `${c.id},${c.name},${c.phone},${c.product},${c.sellerName},${c.createTime},${c.reviewDate},${status}\n`;
            });

            const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "所有客户数据.csv";
            a.click();
            URL.revokeObjectURL(url);
        }

        // 关闭弹窗
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        // 退出登录
        function logout() {
            location.reload();
        }

        // 页面加载初始化
        window.onload = async function() {
            await initDB();
        };
    </script>
</body>
</html>
